            <div class="texto-detallado" 
                data-es="<p>Realiza trabajos de edición y masterización con un enfoque minucioso y profundamente musical, cuidando cada detalle para lograr un resultado claro, equilibrado y fiel a la intención del intérprete. Su experiencia como clarinetista en el mundo sinfónico al más alto nivel, unida a un oído especialmente sensible, le ha llevado a ser conocido por algunos colegas como “el Doctor del clarinete”. Desde esa combinación de precisión técnica y sensibilidad artística, aborda el sonido con una atención excepcional, ajustando cada elemento con criterio y profundidad.</p><br><p>Entre los proyectos recientes destaca la edición y masterización del CD Ecos del Alma, del clarinetista Manuel Gómez. Fue un trabajo realizado íntegramente a distancia, gracias a una comunicación constante y a un proceso de escucha compartida que permitió tomar decisiones conjuntas sin necesidad de coincidir físicamente. Debajo de esta descripción se incluye un enlace a uno de los temas del álbum.</p>"
                data-en="<p>He carries out editing and mastering work with a meticulous and deeply musical approach, taking care of every detail to achieve a result that is clear, balanced, and faithful to the performer's intention. His experience as a clarinetist in the symphonic world at the highest level, together with an especially sensitive ear, has led him to be known by some colleagues as 'the Clarinet Doctor'. From this combination of technical precision and artistic sensitivity, he approaches sound with exceptional attention, adjusting each element with judgment and depth.</p><br><p>Among recent projects, the editing and mastering of the CD Ecos del Alma by clarinetist Manuel Gómez stands out. It was a project carried out entirely remotely, thanks to constant communication and a shared listening process that allowed for joint decision-making without the need to meet physically. Below this description is a link to one of the tracks from the album.</p>">

    <script>
        const langSwitch = document.getElementById('lang-switch');
        let currentLang = localStorage.getItem('prefLang') || 'es';
        const updateLanguage = (lang) => {
            document.querySelectorAll('[data-es]').forEach(el => {
                const content = el.getAttribute(`data-${lang}`);
                if (el.classList.contains('texto-detallado')) el.innerHTML = content;
                else el.innerText = content;
            });
            langSwitch.innerText = lang === 'es' ? 'EN' : 'ES';
            localStorage.setItem('prefLang', lang);
        };
        langSwitch.addEventListener('click', () => {
            currentLang = currentLang === 'es' ? 'en' : 'es';
            updateLanguage(currentLang);
        });
        updateLanguage(currentLang);
    </script>

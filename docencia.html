            <h2 class="titulo-servicio" data-es="Docencia" data-en="Teaching">Docencia</h2>
            <div class="texto-detallado" 
                data-es="<div class='desc-docencia'><p>Su actividad docente se ha desarrollado en distintos países, impartiendo clases magistrales, cursos de música y sesiones como profesor invitado en orquestas jóvenes. Ha sido asistente del profesor Yehuda Gilad en diversos cursos internacionales, colaborando en procesos formativos de alto nivel.</p><br><p>Además, ofrece clases individuales de clarinete a través de Zoom y de la plataforma PlayWithAPro, adaptándose al nivel y las necesidades de cada estudiante, desde principiantes hasta clarinetistas de nivel profesional, tanto para un desarrollo general como para preparaciones específicas como pruebas de orquesta, banda profesional u oposición para profesor de conservatorio.</p></div><div class='resenas-container'><h4 class='titulo-resenas'>RESEÑAS</h4><div class='resena-item'><p class='resena-texto'>'He sido clarinete principal de la Sinfónica de Boulder durante ocho años. Últimamente sentía que mi forma de tocar no progresaba y descubrí que Iván Marín García estaba disponible en PlayWithAPro, a quien seguía en YouTube desde hacía tiempo. Debo admitir que dar el primer paso para contactar con él me inquietó un poco, pero las clases han superado con creces mis expectativas. Son inspiradoras y me han abierto puertas a posibilidades que no imaginaba. En muy poco tiempo, Iván me ha hecho reflexionar sobre aspectos en los que nunca había pensado, y siento que ahora abordo la música con una mentalidad completamente diferente. Estoy asombrado por el progreso logrado hasta ahora y espero seguir trabajando con él a largo plazo. Animo a cualquiera a dar ese primer paso. Me alegraré siempre de haberlo hecho.'</p><p class='resena-autor'>Jack Chih-Chieh Chen <br class='resena-autor'>Orquesta Sinfónica de Boulder (U.S.A.)</p></div><div class='resena-item'><p class='resena-texto'>'Recomiendo ampliamente a Iván como profesor, ya sea para una sola clase o como profesor habitual. Tiene la capacidad de motivar desde el principio y va directo al punto clave que necesitas trabajar o mejorar, lo que hace que sus clases realmente valgan la pena. Posee una amplia experiencia tanto en repertorio orquestal como en preparación de audiciones, así como en la creación de cualquier pieza solista, sonata o concierto. Su conocimiento como artesano de boquillas y su gran habilidad como intérprete lo convierten en un guía perfecto para ayudarte a encontrar tu propia voz.'</p><p class='resena-autor'>Jordi Pons <br class='resena-autor'>Conservatorio della Svizzera Italiana (Italia)</p></div><div class='resena-item'><p class='resena-texto'>'Iván es el tipo de profesor que todo músico debería buscar: un guía capaz de transmitir conocimientos que van más allá de la técnica y la interpretación del clarinete. Para mí, es un profesor versátil, motivador y profundamente implicado en cualquier aspecto que se necesite trabajar. Tiene mucha experiencia y un gran conocimiento del ser humano. Lo recomiendo porque su capacidad para sacar lo mejor de mí es extraordinaria.'</p><p class='resena-autor'>Mariola Gil Lago <br class='resena-autor'>CSMA - Galicia (España)</p></div></div>"
                data-en="<div class='desc-docencia'><p>His teaching activity has taken place in various countries, giving masterclasses, music courses, and sessions as a guest professor in youth orchestras. He has been an assistant to Professor Yehuda Gilad in several international courses, collaborating in high-level training processes.</p><p>In addition, he offers individual clarinet lessons via Zoom and the PlayWithAPro platform, adapting to the level and needs of each student, from beginners to professional-level clarinetists for both general development and specific preparations such as orchestra and professional band auditions or the conservatory teaching exam.</p></div><div class='resenas-container'><h4 class='titulo-resenas'>REVIEWS</h4><div class='resena-item'><p class='resena-texto'>'I have been principal clarinet of the Boulder Philharmonic for eight years. Lately, I felt my playing was not progressing and discovered Iván Marín García was available on PlayWithAPro, whom I had followed on YouTube for a long time. I must admit that taking the first step to contact him made me a bit uneasy, but the lessons have far exceeded my expectations. They are inspiring and have opened doors to possibilities I hadn't imagined. In a very short time, Iván has made me reflect on aspects I had never thought about, and I feel I now approach music with a completely different mindset. I am amazed by the progress made so far and look forward to continuing to work with him long term. I encourage anyone to take that first step. I will always be glad I did.'</p><p class='resena-autor'>Jack Chih-Chieh Chen <br class='resena-autor'>Boulder Symphony Orchestra (U.S.A.)</p></div><div class='resena-item'><p class='resena-texto'>'I highly recommend Iván as a teacher, whether for a single class or as a regular teacher. He has the ability to motivate from the start and goes straight to the key point you need to work on or improve, which makes his classes truly worth it. He has extensive experience in both orchestral repertoire and audition preparation, as well as the creation of any solo piece, sonata, or concerto. His knowledge as a mouthpiece craftsman and his great skill as a performer make him a perfect guide to help you find your own voice.'</p><p class='resena-autor'>Jordi Pons <br class='resena-autor'>Conservatorio della Svizzera Italiana (Italy)</p></div><div class='resena-item'><p class='resena-texto'>'Iván is the type of teacher every musician should look for: a guide capable of transmitting knowledge that goes beyond technique and clarinet performance. For me, he is a versatile, motivating teacher, deeply involved in whatever aspect needs work. He has a lot of experience and a great understanding of the human being. I recommend him because his ability to bring out the best in me is extraordinary.'</p><p class='resena-autor'>Mariola Gil Lago <br class='resena-autor'>CSMA - Galicia (Spain)</p></div></div>">
            </div>

    <script>
        const langSwitch = document.getElementById('lang-switch');
        let currentLang = localStorage.getItem('prefLang') || 'es';
        const updateLanguage = (lang) => {
            document.querySelectorAll('[data-es]').forEach(el => {
                const content = el.getAttribute(`data-${lang}`);
                if (el.classList.contains('texto-detallado')) el.innerHTML = content;
                else el.innerText = content;
            });
            langSwitch.innerText = lang === 'es' ? 'EN' : 'ES';
            localStorage.setItem('prefLang', lang);
        };
        langSwitch.addEventListener('click', () => {
            currentLang = currentLang === 'es' ? 'en' : 'es';
            updateLanguage(currentLang);
        });
        updateLanguage(currentLang);
    </script>

            <h2 class="titulo-servicio" data-es="Retoque de Boquillas" data-en="Mouthpiece Refacing">Retoque de Boquillas</h2>
            <div class="texto-detallado" 
                data-es="<p>Realiza un trabajo de ajuste artesanal basado en un oído especialmente sensible y en años de experiencia en el mundo sinfónico. Su enfoque combina precisión técnica y una comprensión profunda del comportamiento del sonido, buscando que cada boquilla responda con mayor claridad, equilibrio y libertad. Es un proceso cuidado y minucioso, adaptado a las particularidades de cada clarinetista.</p><br><p>Comparte algunos ejemplos de estos ajustes en su página de Facebook dedicada a las boquillas, así como en una selección de vídeos en su canal de YouTube donde se pueden ver distintos procesos de retoque. Debajo de esta descripción se incluyen también opiniones de destacados clarinetistas que han experimentado este tipo de ajustes.</p><div class='links-boquillas'><a href='https://www.facebook.com/ZenClarinet/photos' target='_blank' class='link-externo'><i class='fa-brands fa-facebook'></i> ZenClarinet (Facebook)</a><a href='https://www.youtube.com/playlist?list=PLF0pF6x8AgwY6Bl78oEzUfgaaqJtaYZiv' target='_blank' class='link-externo'><i class='fa-brands fa-youtube'></i> Procesos de Retoque (YouTube)</a></div><div class='resenas-container'><h4 class='titulo-resenas'>RESEÑAS</h4><div class='resena-item'><p class='resena-texto'>“Esta semana he recibido tres boquillas B40 13 retocadas por Iván Marín García y ¡me encantan! Gran enfoque, excelente afinación y muy fácil a la hora de conseguir colores. ¡Nunca había probado nada parecido!”</p><p class='resena-autor'>José González Granero <br class='resena-autor'>Clarinete principal de la Orquesta de la Ópera de San Francisco</p></div><div class='resena-item'><p class='resena-texto'>Gran fin de semana el que he pasado junto al MAGO (Iván Marín García) en La Coruña. El martes se llevó mi clarinete en La, Buffet R13, el cual necesitaba una recuperación y nutrición de la madera, zapatillas nuevas, engrasado y ajuste. Tras cuatro días de trabajo de limpieza de la madera, oídos y llaves y nutrir la madera con aceites naturales de gran calidad y su posterior montaje y ajuste valorando incluso el cambio de cada corcho y la calidad de cada uno de ellos y su respuesta en la sonoridad del clarinete, el domingo por la mañana pude, por fin, experimentar el cambio en mi clarinete. Ha sufrido una recuperación en igualdad, sonoridad, timbre y flexibilidad increíbles. Quedé embelesado e ilusionado por volver a disfrutar plenamente de este clarinete. Muchísimas gracias Iván por tu trabajo, meticulosidad, profesionalidad e implicación personal en cada proyecto que aceptas.<br><br>Posteriormente cambiamos el foco al material que acompaña al clarinete: barriletes, campanas, abrazaderas, compensadores y, por último, a la boquilla. No conozco clarinetista con un oído médico para la música como el de Iván. Gran ayuda y consejos los que, nuevamente, recibí de él.<br><br>Por último, quería dejar constancia del trabajo de Iván con sus boquillas IM en material Zinner. Nuevo paso el que he dado esta semana hacia un sonido más vocal y expresivo pero sin perder el centro. Como ya comenté hace un tiempo, Iván me hizo una copia mil veces mejorada de mi M15 con material Zinner con la que he estado tocando hasta ahora. Esta semana me dejó una de sus boquillas IM (con su curva personal) que pensó que me podía gustar y ayudar en mi camino. Bueno, pues ya en su casa, probé la que él toca y alguna más que tenía por allí y, efectivamente, la magia volvió a hacer acto de presencia. Acertó de pleno en su premonición; la que me había dejado era la que mejor me iba. Bravo Iván y de nuevo millones de gracias por tu compartir tus conocimientos, preparación y profesionalidad y, por supuesto, por tu generosidad. Gran abrazo!!! También fue divertido compartir las cervezas y comida de esas tierras en la mejor de las compañías.</p><p class='resena-autor'>Vicente Germán Samper <br class='resena-autor'>Clarinete solista de la Banda del Rey de España</p></div><div class='resena-item'><p class='resena-texto'>Recibí las boquillas de clarinete hace un par de semanas y, ahora que he tenido la oportunidad de tocarlas y acostumbrarme a ellas, me gustaría darte mi opinión positiva al respecto.<br><br>- Contacté con Iván para ver si seguía restaurando y retocando boquillas, en particular las Vandoren B40 13 Series. Tengo una retocada por él desde 2019 y me ha ido excelente, pero me preocupaba tener solo una boquilla y buscaba otra de repuesto.<br><br>- Al final he añadido 2 boquillas más, una Vandoren B40 13 y una Zinner que Iván tenía disponibles. La forma en que Iván ha trabajado conmigo ha sido una auténtica revelación. Usando WhatsApp como medio de comunicación, en lugar de simplemente retocar una boquilla y enviarla, Iván empezó a preguntarme sobre mí: sobre mi nivel como músico, qué configuraciones utilizaba, qué tipo de música tocaba, qué sonido me gustaba, qué buscaba, etc. Así que se tomó mucho tiempo para preguntarme quién era y qué buscaba. Luego empezó el proceso de selección de un par de boquillas. Usó grabaciones de voz y videos para contarme lo que tenía, lo que podía ofrecerme, cómo podía trabajar las boquillas, cómo iban y cómo podrían mejorar durante el proceso de retocarlas. Entonces pude dar yo mi opinión sobre lo que escuchaba, y pude hacer peticiones. Iván trabajaba constantemente para que las boquillas quedaran en su 'mejor estado', como él mismo decía. Me impresionó su meticulosidad para que quedaran perfectas, y siguió trabajando hasta que estuvo satisfecho con que las piezas estuvieran en ese 'mejor estado posible'. Originalmente solo quería una boquilla más, pero terminé con dos más, ya que ambas sonaban muy bien, parecidas, pero también diferentes debido a los distintos materiales. Pero lo que también fue impresionante fue que Iván se esforzó al máximo para que se sintieran igual y se tocaran lo más parecido posible, con la misma caña.<br><br>- Cuando las recibí, me quedé impresionado con su calidad. Muy cómodas, precisas y con buena respuesta, y muy flexibles en cuanto a dinámica y calidad de sonido. Hay algo especial en cómo van, es como si tuvieran alma, y puedo sentir la pasión de Iván por su arte, su instrumento y la creación musical cuando toco sus boquillas.<br><br>- Gracias de nuevo por tu experiencia, tu artesanía y el tiempo que has dedicado a la hora de hacer estas boquillas tan especiales.</p><p class='resena-autor'>Andy Faden <br class='resena-autor'>Clarinetista y constructor de gaitas irlandesas</p></div></div>"
                data-en="<p>He performs handcrafted refacing work based on an especially sensitive ear and years of experience in the symphonic world. His approach combines technical precision with a deep understanding of sound behavior, seeking for each mouthpiece to respond with greater clarity, balance, and freedom. It is a careful and meticulous process, adapted to the specific needs of each clarinetist.</p><br><p>He shares examples of these adjustments on his Facebook page dedicated to mouthpieces, as well as in a selection of videos on his YouTube channel. Below are reviews from prominent clarinetists who have experienced these adjustments.</p><div class='links-boquillas'><a href='https://www.facebook.com/ZenClarinet/photos' target='_blank' class='link-externo'><i class='fa-brands fa-facebook'></i> ZenClarinet (Facebook)</a><a href='https://www.youtube.com/playlist?list=PLF0pF6x8AgwY6Bl78oEzUfgaaqJtaYZiv' target='_blank' class='link-externo'><i class='fa-brands fa-youtube'></i> Refacing Processes (YouTube)</a></div><div class='resenas-container'><h4 class='titulo-resenas'>REVIEWS</h4><div class='resena-item'><p class='resena-texto'>“This week I received three B40 13 mouthpieces refaced by Iván Marín García and I love them! Great focus, excellent intonation, and very easy to achieve different colors. I had never tried anything like it!”</p><p class='resena-autor'>José González Granero <br class='resena-autor'>Principal Clarinet of the San Francisco Opera Orchestra</p></div><div class='resena-item'><p class='resena-texto'>What a great weekend I spent with the WIZARD (Iván Marín García) in La Coruña. On Tuesday he took my A clarinet, a Buffet R13, which needed restoration and wood nourishment, new pads, oiling, and adjustment. After four days of work cleaning the wood, tone holes, and keys, and nourishing the wood with high-quality natural oils, followed by assembly and adjustment—even evaluating the replacement of each cork and its quality and response in the clarinet's resonance—on Sunday morning I was finally able to experience the change in my clarinet. It has undergone an incredible recovery in consistency, resonance, timbre, and flexibility. I was mesmerized and excited to fully enjoy this clarinet again. Thank you so much, Iván, for your work, meticulousness, professionalism, and personal involvement in every project you accept.<br><br>Later, we shifted focus to the materials that accompany the clarinet: barrels, bells, ligatures, patches, and finally, the mouthpiece. I don’t know any clarinetist with a medical ear for music like Iván's. Great help and advice were what I received from him once again.<br><br>Lastly, I wanted to record Iván's work with his IM mouthpieces in Zinner material. A new step I've taken this week toward a more vocal and expressive sound without losing the core. As I mentioned some time ago, Iván made me an infinitely improved copy of my M15 with Zinner material that I’ve been playing until now. This week he lent me one of his IM mouthpieces (with his personal curve) that he thought I might like and could help me on my path. Well, at his house, I tried the one he plays and a few others he had there, and indeed, the magic reappeared. He was spot on in his premonition; the one he lent me was the one that suited me best. Bravo Iván, and again, thanks a million for sharing your knowledge, preparation, and professionalism — and of course, for your generosity. A big hug! It was also fun sharing beers and the food from your region in the best company.</p><p class='resena-autor'>Vicente Germán Samper <br class='resena-autor'>Solo Clarinet of the Spanish Royal Guard Band</p></div><div class='resena-item'><p class='resena-texto'>I received the clarinet mouthpieces a couple of weeks ago and, now that I’ve had the chance to play them and get used to them, I’d like to give you my positive feedback.<br><br>- I contacted Iván to see if he was still restoring and refacing mouthpieces, particularly the Vandoren B40 13 Series. I’ve had one refaced by him since 2019 and it’s been excellent, but I was worried about having only one mouthpiece and was looking for a spare.<br><br>- In the end, I added 2 more mouthpieces, a Vandoren B40 13 and a Zinner that Iván had available. The way Iván worked with me was a true revelation. Using WhatsApp as a means of communication, instead of just refacing a mouthpiece and sending it, Iván started asking about me: about my level as a musician, what setups I used, what kind of music I played, what sound I liked, what I was looking for, etc. So he took a lot of time to ask who I was and what I was looking for. Then the selection process for a couple of mouthpieces began. He used voice recordings and videos to tell me what he had, what he could offer, how he could work on the mouthpieces, how they were performing, and how they might improve during the refacing process. Then I could give my feedback on what I heard and make requests. Iván worked constantly to ensure the mouthpieces were in their 'best state,' as he called it. I was impressed by his meticulousness to make them perfect, and he kept working until he was satisfied that the pieces were in that 'best possible state.' Originally I only wanted one more mouthpiece, but I ended up with two more, as both sounded great—similar, but also different due to the different materials. But what was also impressive was that Iván went above and beyond to make them feel the same and play as similarly as possible with the same reed.<br><br>- When I received them, I was blown away by their quality. Very comfortable, precise, and responsive, and very flexible in terms of dynamics and sound quality. There’s something special about how they play; it’s as if they have a soul, and I can feel Iván’s passion for his craft, his instrument, and music-making when I play his mouthpieces.<br><br>- Thanks again for your expertise, your craftsmanship, and the time you spent making these very special mouthpieces.</p><p class='resena-autor'>Andy Faden <br class='resena-autor'>Clarinetist and Uilleann Pipes maker</p></div></div>">

    <script>
        const langSwitch = document.getElementById('lang-switch');
        let currentLang = localStorage.getItem('prefLang') || 'es';
        const updateLanguage = (lang) => {
            document.querySelectorAll('[data-es]').forEach(el => {
                const content = el.getAttribute(`data-${lang}`);
                if (el.classList.contains('texto-detallado')) el.innerHTML = content;
                else el.innerText = content;
            });
            langSwitch.innerText = lang === 'es' ? 'EN' : 'ES';
            localStorage.setItem('prefLang', lang);
        };
        langSwitch.addEventListener('click', () => {
            currentLang = currentLang === 'es' ? 'en' : 'es';
            updateLanguage(currentLang);
        });
        updateLanguage(currentLang);
    </script>

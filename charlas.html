            <div class="texto-detallado" 
                data-es="<p>En los últimos años ha compartido reflexiones con estudiantes de música a través de conferencias centradas en la relación entre estado interno, rendimiento y percepción. En ellas aborda temas como el funcionamiento del campo electromagnético del corazón, la gestión del ego, el miedo escénico y ciertos experimentos de la física cuántica que ayudan a comprender cómo la atención, la coherencia y la calidad del pensamiento influyen en la interpretación musical. Son encuentros diseñados para ofrecer claridad, herramientas prácticas y una comprensión más amplia del proceso artístico.</p><br><p>Paralelamente, impulsa espacios de diálogo con profesores, equipos directivos, educadores, jefes de empresa y grupos interesados en explorar nuevas formas de pensar y relacionarse con su trabajo. Estos encuentros no siguen un formato expositivo, sino conversacional: se construyen desde la curiosidad, la escucha y el intercambio honesto. A partir de ese diálogo, propone alternativas sencillas para mejorar el rendimiento, cultivar responsabilidad individual, comprender el papel del ego y explorar maneras de funcionar desde un lugar más coherente y presente.</p>"
                data-en="<p>In recent years, he has shared reflections with music students through conferences focused on the relationship between internal state, performance, and perception. In them, he addresses topics such as the functioning of the heart's electromagnetic field, ego management, stage fright, and certain experiments in quantum physics that help us understand how attention, coherence, and the quality of thought influence musical interpretation. These meetings are designed to offer clarity, practical tools, and a broader understanding of the artistic process.</p><br><p>Parallel to this, he promotes spaces for dialogue with teachers, management teams, educators, business leaders, and groups interested in exploring new ways of thinking and relating to their work. These encounters do not follow an expository format, but rather a conversational one: they are built from curiosity, listening, and honest exchange. From this dialogue, he proposes simple alternatives to improve performance, cultivate individual responsibility, understand the role of the ego, and explore ways to function from a more coherent and present place.</p>">

    <script>
        const langSwitch = document.getElementById('lang-switch');
        let currentLang = localStorage.getItem('prefLang') || 'es';
        const updateLanguage = (lang) => {
            document.querySelectorAll('[data-es]').forEach(el => {
                const content = el.getAttribute(`data-${lang}`);
                if (el.classList.contains('texto-detallado')) el.innerHTML = content;
                else el.innerText = content;
            });
            langSwitch.innerText = lang === 'es' ? 'EN' : 'ES';
            localStorage.setItem('prefLang', lang);
        };
        langSwitch.addEventListener('click', () => {
            currentLang = currentLang === 'es' ? 'en' : 'es';
            updateLanguage(currentLang);
        });
        updateLanguage(currentLang);
    </script>

            <h2 class="titulo-servicio" data-es="Acompañamiento Artístico" data-en="Artistic Guidance">Acompañamiento Artístico</h2>
            <div class="texto-detallado" 
                data-es="<p>Colaboro con músicos creadores que buscan claridad, profundidad y coherencia en su interpretación.</p><br><p>Mi papel no es el de un profesor tradicional ni el de un coach al uso: es una escucha fina, un diálogo artístico y una mirada externa capaz de detectar matices técnicos y expresivos que a veces pasan desapercibidos incluso para intérpretes experimentados.</p><br><p>Este trabajo nace del respeto y de la sensibilidad que he desarrollado como músico, y también de mi formación en coaching y PNL, disciplinas que he integrado de forma muy personal tras toda una vida observando el comportamiento humano.</p><br><p>Con intérpretes de alto nivel, el proceso se convierte en un intercambio entre iguales donde, además del diálogo, aporto una atención precisa que ayuda a hacer conscientes aspectos fundamentales de la interpretación y a alinearlos con la intención musical.</p><br><p>También trabajamos la dimensión interna del intérprete: la confianza, la presencia y la capacidad de ejecutar desde un lugar abierto y estable, en vez de desde la tensión o el miedo. Cuando esto ocurre, la técnica y la expresión se integran de forma natural.</p><br><p>Acompaño a quienes desean descubrir perspectivas y caminos interpretativos que, por estar dentro de su propio proceso, quizá no habían podido ver, ampliando así su claridad y su libertad artística.</p><div class='resenas-container'><h4 class='titulo-resenas'>COLABORACIONES</h4><div class='colaborador-card'><div class='colaborador-header'><img src='Imagenes/Manuel.jpeg' alt='Manuel Gómez' class='colaborador-img-pro'><div class='colaborador-info'><p class='resena-autor'>Manuel Gómez</p><a href='https://manuelgomez.info/' target='_blank' class='colaborador-link'><i class='fa-solid fa-globe'></i> PAGINA WEB</a></div></div><div class='colaborador-body'><p class='resena-texto'>Con Manuel he tenido la oportunidad de colaborar en la creación de su CD Ecos del Alma, realizando la edición y la masterización. Fue un proceso que puso la guinda vibracional a su trabajo, un camino compartido donde cada detalle se afinó desde la sensibilidad, la escucha y la búsqueda de coherencia profunda.</p><br><p class='resena-texto'>Además, Manuel ha contado conmigo como guía general en su proceso interpretativo, un acompañamiento donde mi mirada externa ha aportado perspectivas que enriquecen y amplían su visión artística.</p></div></div><div class='colaborador-card'><div class='colaborador-header'><img src='Imagenes/Carlos Casanova.jpeg' alt='Carlos Casanova' class='colaborador-img-pro'><div class='colaborador-info'><p class='resena-autor'>Carlos Casanova</p><a href='http://www.carloscasanova.es/' target='_blank' class='colaborador-link'><i class='fa-solid fa-globe'></i> PAGINA WEB</a></div></div><div class='colaborador-body'><p class='resena-texto'>Con Carlos comparto un trabajo muy similar: un acompañamiento interpretativo donde exploramos nuevas posibilidades técnicas, expresivas e internas que fortalecen su claridad y su presencia musical.</p><br><p class='resena-texto'>Carlos ha expresado su deseo de contar con mi oído en futuras grabaciones, invitándome a estar presente para influir en el resultado final desde esa perspectiva externa que abre caminos que a veces no se ven desde dentro.</p></div></div></div>"
                data-en="<p>I collaborate with creative musicians seeking clarity, depth, and coherence in their performance.</p><br><p>My role is not that of a traditional teacher or a typical coach: it is a fine listening, an artistic dialogue, and an external gaze capable of detecting technical and expressive nuances that sometimes go unnoticed even by experienced performers.</p><br><p>This work is born from the respect and sensitivity I have developed as a musician, as well as my training in coaching and NLP—disciplines I have integrated in a very personal way after a lifetime of observing human behavior.</p><br><p>With high-level performers, the process becomes an exchange between equals where, beyond dialogue, I provide precise attention that helps bring fundamental aspects of interpretation into conscious awareness, aligning them with musical intention.</p><br><p>We also work on the performer's internal dimension: confidence, presence, and the ability to execute from an open and stable place, rather than from tension or fear.</p><br><p>I accompany those who wish to discover interpretative perspectives and paths that, being within their own process, they might not have been able to see, thus expanding their artistic clarity and freedom.</p><div class='resenas-container'><h4 class='titulo-resenas'>COLLABORATIONS</h4><div class='colaborador-card'><div class='colaborador-header'><img src='Imagenes/Manuel.jpeg' alt='Manuel Gómez' class='colaborador-img-pro'><div class='colaborador-info'><p class='resena-autor'>Manuel Gómez</p><a href='https://manuelgomez.info/' target='_blank' class='colaborador-link'><i class='fa-solid fa-globe'></i> WEBSITE</a></div></div><div class='colaborador-body'><p class='resena-texto'>With Manuel, I have had the opportunity to collaborate on the creation of his CD Ecos del Alma, performing the editing and mastering. It was a process that provided the vibrational finishing touch to his work—a shared journey where every detail was refined through sensitivity, listening, and a search for deep coherence.</p><br><p class='resena-texto'>Furthermore, Manuel has relied on me as a general guide in his interpretative process, an accompaniment where my external gaze has provided perspectives that enrich and broaden his artistic vision.</p></div></div><div class='colaborador-card'><div class='colaborador-header'><img src='Imagenes/Carlos Casanova.jpeg' alt='Carlos Casanova' class='colaborador-img-pro'><div class='colaborador-info'><p class='resena-autor'>Carlos Casanova</p><a href='http://www.carloscasanova.es/' target='_blank' class='colaborador-link'><i class='fa-solid fa-globe'></i> WEBSITE</a></div></div><div class='colaborador-body'><p class='resena-texto'>With Carlos, I share a very similar work: an interpretative accompaniment where we explore new technical, expressive, and internal possibilities that strengthen his clarity and musical presence.</p><br><p class='resena-texto'>Carlos has expressed his desire to have my ear in future recordings, inviting me to be present to influence the final result from that external perspective which opens paths that are sometimes invisible from within.</p></div></div></div>">

    <script>
        const langSwitch = document.getElementById('lang-switch');
        let currentLang = localStorage.getItem('prefLang') || 'es';
        const updateLanguage = (lang) => {
            document.querySelectorAll('[data-es]').forEach(el => {
                const content = el.getAttribute(`data-${lang}`);
                if (el.classList.contains('texto-detallado')) el.innerHTML = content;
                else el.innerText = content;
            });
            langSwitch.innerText = lang === 'es' ? 'EN' : 'ES';
            localStorage.setItem('prefLang', lang);
        };
        langSwitch.addEventListener('click', () => {
            currentLang = currentLang === 'es' ? 'en' : 'es';
            updateLanguage(currentLang);
        });
        updateLanguage(currentLang);
    </script>
